<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --text: #e6eaf5;
    --muted: #8b95b0;
    --accent: #22c55e;
    --accent-rgb: 34, 197, 94;
  }
  body[data-state="error"] {
    --accent: #ef4444;
    --accent-rgb: 239, 68, 68;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  /* サイバーグリッド背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    pointer-events: none;
  }

  /* 背景のネオングロー */
  body::after {
    content: "";
    position: fixed;
    width: 560px;
    height: 560px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, rgba(var(--accent-rgb), .22), transparent 65%);
    filter: blur(40px);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 44px 32px 32px;
    text-align: center;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
    border: 1px solid rgba(255, 255, 255, .09);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
            backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, .55),
      0 0 0 1px rgba(var(--accent-rgb), .12),
      0 0 48px rgba(var(--accent-rgb), .14);
    animation: fadeIn .8s cubic-bezier(.2, .8, .2, 1) both;
  }

  /* カード上端のネオンライン */
  .card::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 18%;
    right: 18%;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 14px var(--accent);
  }

  .icon {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--accent);
    background: rgba(var(--accent-rgb), .1);
    border: 2px solid var(--accent);
    box-shadow:
      0 0 24px rgba(var(--accent-rgb), .55),
      inset 0 0 20px rgba(var(--accent-rgb), .25);
    animation: glow 2.8s ease-in-out infinite;
  }
  .icon svg {
    width: 40px;
    height: 40px;
    fill: none;
    stroke: currentColor;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px var(--accent));
  }
  .icon .ico-error { display: none; }
  body[data-state="error"] .icon .ico-success { display: none; }
  body[data-state="error"] .icon .ico-error { display: block; }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.35;
    text-shadow: 0 0 22px rgba(var(--accent-rgb), .45);
  }

  .message {
    margin-top: 12px;
    font-size: .95rem;
    line-height: 1.75;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  /* 詳細・エラーコード欄（空なら非表示） */
  .detail {
    margin-top: 22px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: .82rem;
    line-height: 1.6;
    color: var(--text);
    text-align: left;
    background: rgba(var(--accent-rgb), .08);
    border: 1px solid rgba(var(--accent-rgb), .3);
    overflow-wrap: anywhere;
  }
  .detail:empty { display: none; }

  .footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, .07);
    font-size: .78rem;
    color: var(--muted);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(var(--accent-rgb), .45), inset 0 0 18px rgba(var(--accent-rgb), .2); }
    50%      { box-shadow: 0 0 38px rgba(var(--accent-rgb), .8),  inset 0 0 26px rgba(var(--accent-rgb), .35); }
  }

  @media (max-width: 480px) {
    .card { padding: 36px 22px 26px; border-radius: 20px; }
    h1 { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .icon { animation: none; }
  }
</style>
</head>

<!--
  プレースホルダー（サーバー側で置換）:
    {{STATE}}   success | error
    {{TITLE}}   見出し
    {{MESSAGE}} 説明文
    {{DETAIL}}  補足/エラーコード（空文字なら非表示）
    {{FOOTER}}  フッター文言
  ※ 値は必ずHTMLエスケープしてから差し込むこと
-->
<body data-state="{{STATE}}">
  <main class="card" role="status" aria-live="polite">
    <div class="icon" aria-hidden="true">
      <svg class="ico-success" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      <svg class="ico-error" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h1>{{TITLE}}</h1>
    <p class="message">{{MESSAGE}}</p>
    <p class="detail">{{DETAIL}}</p>
    <p class="footer">{{FOOTER}}</p>
  </main>
</body>
</html>
