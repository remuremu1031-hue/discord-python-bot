<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord 認証</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b0f19;
    color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    margin: 16px;
    padding: 32px 24px;
    text-align: center;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(88, 101, 242, 0.6);
    box-shadow: 0 0 24px rgba(88, 101, 242, 0.35);
  }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  p { margin: 0 0 24px; line-height: 1.7; color: #9ca3af; }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    border-radius: 10px;
    background: #5865f2;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
  }
  .btn:active { background: #4752c4; }
  .note { margin: 20px 0 0; font-size: 0.8rem; color: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 Discord 認証</h1>
    <p>下のボタンからDiscordにログインすると、認証が完了してロールが自動で付与されます。</p>
    <a class="btn" href="/login">Discordでログイン</a>
    <p class="note">取得する情報は、ユーザーIDとアカウント名のみです。</p>
  </div>
</body>
</html>
